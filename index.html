&lt;small id=&quot;scaleNote&quot;&gt;&lt;/small&gt;&lt;small id=&quot;medcityWarning&quot; hidden style=&quot;display:block;margin-top:8px;padding:10px;background:#fff8e7;border:1px solid #dfbd77;border-radius:9px;color:#6d501a&quot;&gt;بيانات المدن الطبية من تطبيق سلم الرواتب (Beseyat) وليست جدولًا رسميًا معتمدًا. خطوات الزيادة محسوبة استرشاديًا من راتب البداية ونسبة الزيادة والسقف. البدلات غير مذكورة في المصدر، ويجب إدخالها من مسير الراتب. احتساب خارج الدوام للمدن الطبية هنا تقديري وفق نموذج التشغيل الذاتي، ولا يثبت أنه النظام المطبق في جهتك.&lt;/small&gt;

&lt;details class=&quot;labor&quot;&gt;&lt;summary&gt;ما البدلات التي أدخلها؟&lt;/summary&gt;&lt;p&gt;اجمع المبالغ الشهرية المستحقة ضمن أجرك الفعلي، مثل بدل السكن النقدي أو بدل خطر أو عدوى إذا استحققته مقابل مخاطر العمل وكان داخلًا في أجرك الفعلي. ارجع إلى عقدك ولائحة جهتك للتحقق من البنود المنطبقة عليك.&lt;/p&gt;&lt;p&gt;مثال: إذا كان بدل السكن ٢٬٠٠٠ ريال والنقل ٩٠٠ ريال ولا توجد بدلات أخرى، فأدخل ٢٬٠٠٠ هنا و٩٠٠ في خانة النقل. أدخل صفرًا إذا لم توجد بدلات أخرى.&lt;/p&gt;&lt;a href=&quot;https://laws.boe.gov.sa/BoeLaws/Laws/LawDetails/08381293-6388-48e2-8ad2-a9a700f2aa94/1&quot;&gt;نظام العمل، المادة الثانية&lt;/a&gt;&lt;/details&gt;

const el=id=&gt;document.getElementById(id),v=id=&gt;Number(el(id).value),fmt=n=&gt;n.toLocaleString('ar-SA',{minimumFractionDigits:2,maximumFractionDigits:2});
function dates(){
 const list=el('days');list.replaceChildren();
 const a=el('start').valueAsNumber,b=el('end').valueAsNumber,labor=el('system').value!=='civil',hasHoliday=el('useHoliday').checked,ha=el('holidayStart').valueAsNumber,hb=el('holidayEnd').valueAsNumber;
 el('normalHours').disabled=!el('useNormal').checked;el('weeklyHours').disabled=!el('useWeekly').checked;el('holidayHours').disabled=!hasHoliday;el('holidayRange').hidden=!hasHoliday;
 el('holidayStart').min=el('holidayEnd').min=el('start').value;el('holidayStart').max=el('holidayEnd').max=el('end').value;
 el('reviewNote').textContent='يظهر بجانب كل تاريخ تصنيفه المعتمد. أدخل صفرًا لاستبعاد اليوم أو عدّل ساعاته.';
 if(!Number.isFinite(a+b)||b&lt;a||b-a&gt;365*86400000)return;
 for(let t=a;t&lt;=b;t+=86400000){const d=new Date(t),weekday=d.getUTCDay(),holiday=hasHoliday&amp;&amp;Number.isFinite(ha+hb)&amp;&amp;t&gt;=ha&amp;&amp;t&lt;=hb;let type=holiday?'holiday':weekday&gt;=5?'weekly':'normal',active=type==='holiday'?hasHoliday:type==='weekly'?el('useWeekly').checked:el('useNormal').checked,hours=type==='holiday'?v('holidayHours'):type==='weekly'?v('weeklyHours'):v('normalHours'),names={normal:'يوم عادي',weekly:'عطلة أسبوعية',holiday:'عطلة رسمية أو عيد'},label=document.createElement('label'),input=document.createElement('input');label.textContent=d.toLocaleDateString('ar-SA-u-ca-gregory',{weekday:'short',month:'short',day:'numeric',timeZone:'UTC'})+' · '+names[type];input.type='number';input.min=0;input.max=type==='normal'?7:(!labor?7:24);input.step='.01';input.dataset.type=type;input.value=active?Math.min(hours,+input.max):0;label.append(input);list.append(label)}
}

function update(){
 const labor=el('system').value!=='civil',health=el('role').value==='كادر صحي';
 el('category').hidden=false;document.querySelectorAll('.labor').forEach(x=&gt;x.hidden=!labor);
 el('rule').textContent=labor?'التشغيل الذاتي • الأيام العادية والعطلة الأسبوعية: أجر الساعة الفعلي + نصف أجر الساعة الأساسي على أساس ٢٤٠ ساعة شهريًا، وبحد ٧ ساعات لليوم العادي. العطلات الرسمية والأعياد: يوم التكليف بيومين ولو كان العمل جزءًا من اليوم.':'الخدمة المدنية • الأيام العادية: الأساسي ÷ ١٥٥ × الساعات الفعلية، بحد ٧ ساعات يوميًا. العطلة الأسبوعية والعطلات الرسمية والأعياد: الأساسي ÷ ١٥٥ × الساعات، بحد ٧ ساعات يوميًا وسقف ١٠٠٪ من الأساسي، ويضاف بدل النقل لكل يوم.'+(health?' للكادر الصحي أدخل فقط الساعات المعتمدة بعد استيفاء الدوام والمناوبات المقررة.':'');
 const inputs=[...el('days').querySelectorAll('input')],s=v('basic'),tr=v('transport'),out=el('result');

function scale(trigger){
 const system=el('system').value,role=el('role'),source=el('source'),med=system==='medcity',opsAdmin=system==='labor'&amp;&amp;role.value==='إداري',auto=source.selectedIndex===1;

 }
 const isMed=el('system').value==='medcity',isOpsAdmin=el('system').value==='labor'&amp;&amp;role.value==='إداري';
 const isCivilAdmin=el('system').value==='civil'&amp;&amp;role.value==='إداري';
 const isEngineering=el('system').value==='civil'&amp;&amp;role.value==='كادر هندسي';
 el('showScale').hidden=!auto;
 source.disabled=false;
 el('jobBox').hidden=!auto||isCivilAdmin;
 el('levelBox').hidden=!auto;
 el('stepBox').hidden=!auto||isMed;

 medCityNote.hidden=!isMed;
 el('basic').readOnly=auto;
 el('transport').readOnly=false;
 if(!auto){el('scaleNote').hidden=true;return}
 if(['system','role','source'].includes(trigger)){

   el('jobBox').childNodes[0].nodeValue='الفئة الإدارية';options('job',Object.keys(operationAdminScales));
  }else if(!isCivilAdmin){
   el('jobBox').childNodes[0].nodeValue=isEngineering?'الفئة الهندسية':'الفئة الصحية';
   options('job',isEngineering?engineeringJobs:jobs);
  }
 }
 const j=el('job').selectedIndex;
 if(['system','role','job','source'].includes(trigger)){
  const count=isMed?medStepCount(medCityGroups[role.value][j]):isCivilAdmin?15:isOpsAdmin?6:isEngineering?engineering[j].length:7;
  options('level',numbers(count));

 }
 const l=el('level').selectedIndex,g=el('step').selectedIndex;

function renderScale(){
 const system=el('system').value,role=el('role').value,isMed=system==='medcity',isOpsAdmin=system==='labor'&amp;&amp;role==='إداري';
 const isCivilAdmin=system==='civil'&amp;&amp;role==='إداري',isEngineering=system==='civil'&amp;&amp;role==='كادر هندسي';
 const j=el('job').selectedIndex,l=el('level').selectedIndex,g=el('step').selectedIndex;

 const header=(labels)=&gt;{const r=head.insertRow();labels.forEach(x=&gt;add(r,'th',x))};

  const r=medCityGroups[role][j],n=medStepCount(r);
  el('scaleTitle').textContent='المدن الطبية | '+role+' | '+(r.ar||r.pos);
  el('scaleSummary').textContent='الراتب الابتدائي: '+medFmt(r.sal)+' ر.س | الزيادة: '+r.inc+'% | السقف: '+(r.cap?medFmt(r.cap):'غير مذكور')+' | المؤهل: '+r.qual+' | التدرج حسابي استرشادي غير معتمد؛ لا تتوفر بدلات النقل في الملف الأصلي.';
  header(['مجموعة الخطوات','خطوة ١','خطوة ٢','خطوة ٣','خطوة ٤','فرق الزيادة عن البداية']);
  for(let z=0;z&lt;n;z+=4){const row=body.insertRow();if(Math.floor(l/4)===z/4)row.className='selectedRow';add(row,'th',Math.floor(z/4)+1);for(let i=0;i&lt;4;i++){let k=z+i;add(row,'td',k&lt;n?medFmt(medStepSalary(r,k)):'—',k===l)}add(row,'td',medFmt(Number(r.sal)*Number(r.inc)/100))}
  return;
 }
 if(isOpsAdmin){
  const cat=el('job').selectedOptions[0]?.textContent;el('scaleTitle').textContent='التشغيل الذاتي | إداري | '+cat;
  el('scaleSummary').textContent='المستوى '+(l+1)+'، الدرجة '+(g+1)+'؛ الخانة الخضراء هي الدرجة المختارة.';
  header(['المستوى','الدرجة ١','الدرجة ٢','الدرجة ٣','الدرجة ٤','العلاوة السنوية','بدل النقل']);
  Object.entries(operationAdminScales[cat]).forEach(([lv,r])=&gt;{const row=body.insertRow();if(+lv===l+1)row.className='selectedRow';add(row,'th',lv);for(let k=1;k&lt;=4;k++)add(row,'td',medFmt(r.steps[k]),+lv===l+1&amp;&amp;k===g+1);add(row,'td',medFmt(r.inc));add(row,'td',medFmt(r.transport))});return;
 }
 if(isCivilAdmin){
  el('scaleTitle').textContent='الخدمة المدنية | السلم الإداري';el('scaleSummary').textContent='المرتبة '+(l+1)+'، الدرجة '+(g+1);
  header(['المرتبة',...numbers(15).map(x=&gt;'الدرجة '+x),'العلاوة','بدل النقل']);
  for(let i=0;i&lt;15;i++){let row=body.insertRow();if(i===l)row.className='selectedRow';add(row,'th',i+1);for(let d=0;d&lt;15;d++)add(row,'td',d&lt;Math.min(15,24-i)?medFmt(ranks[i]+raises[i]*d):'—',i===l&amp;&amp;d===g);add(row,'td',medFmt(raises[i]));add(row,'td',i&lt;5?'500':i&lt;10?'700':i&lt;13?'900':i===13?'1200':'—')}return;
 }
 const matrix=isEngineering?engineering:system==='labor'?operation:civil,incs=isEngineering?engineeringIncrements:increments;

 el('scaleTitle').textContent=job+' | '+(system==='labor'?'التشغيل الذاتي':'الخدمة المدنية');
 el('scaleSummary').textContent='المستوى '+(l+1)+'، الدرجة '+(g+1);
 header(['المستوى','الدرجة ١','الدرجة ٢','الدرجة ٣','الدرجة ٤','العلاوة السنوية','بدل النقل']);
 for(let i=0;i&lt;matrix[j].length;i++){const row=body.insertRow();if(i===l)row.className='selectedRow';add(row,'th',i+1);for(let d=0;d&lt;4;d++)add(row,'td',medFmt(matrix[j][i]+incs[j][i]*d),i===l&amp;&amp;d===g);add(row,'td',medFmt(incs[j][i]));add(row,'td',medFmt(isEngineering?engineeringTransport[j]:healthTransport[j][i]))}
}

<style>
/* تحسين شريط التنقل ومنع التمدد على الشاشات الصغيرة */
nav[aria-label="اختيار الحاسبة"]{flex-wrap:wrap;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px #103f3412}
nav[aria-label="اختيار الحاسبة"] button{transition:background .15s,color .15s;white-space:normal}
nav[aria-label="اختيار الحاسبة"] button:focus-visible{outline:3px solid #bf9854;outline-offset:2px}
iframe[hidden]{display:none!important}
@media(max-width:600px){nav[aria-label="اختيار الحاسبة"] button{flex:1 1 100%;text-align:center}}
</style>
<script>
(function(){
  'use strict';
  const nav=document.querySelector('nav[aria-label="اختيار الحاسبة"]');
  const tabs=Array.from(nav.querySelectorAll('button'));
  const pages=Array.from(document.querySelectorAll('iframe[srcdoc]'));
  if(tabs.length!==pages.length){console.error('عدد الأزرار لا يطابق عدد الحاسبات');return;}
  function activate(index){
    tabs.forEach((tab,i)=>{
      const active=i===index;
      tab.setAttribute('aria-pressed',String(active));
      tab.setAttribute('aria-controls','calculator-page-'+i);
      pages[i].hidden=!active;
      pages[i].setAttribute('aria-hidden',String(!active));
    });
  }
  pages.forEach((page,i)=>{page.id='calculator-page-'+i;page.setAttribute('loading','eager')});
  tabs.forEach((tab,i)=>{
    tab.type='button';
    tab.addEventListener('click',()=>activate(i));
    tab.addEventListener('keydown',event=>{
      if(event.key!=='ArrowRight'&&event.key!=='ArrowLeft')return;
      event.preventDefault();
      const delta=event.key==='ArrowLeft'?1:-1;
      const next=(i+delta+tabs.length)%tabs.length;
      activate(next);tabs[next].focus();
    });
  });
  activate(0);
})();
</script>
