 const h=inputs.map(i=&gt;+i.value).filter(n=&gt;n&gt;0),sum=h.reduce((a,b)=&gt;a+b,0),pay=labor?sum*(s*1.5+tr+v(&#x27;extra&#x27;))/240:h.reduce((a,n)=&gt;a+Math.min(n*s/155,s/60),0),travel=labor?0:h.length*tr/30;
